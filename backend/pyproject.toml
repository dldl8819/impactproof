[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impactproof-backend"
version = "0.1.0"
description = "ImpactProof FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "psycopg[binary]==3.2.3",
  "python-dotenv==1.0.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "ruff==0.8.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
